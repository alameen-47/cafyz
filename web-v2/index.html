
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
      <meta name="theme-color" content="#070511" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <title>Cafyz Restaurant Management App</title>
      <meta name="description" content="Streamline restaurant management with a user-friendly web and mobile app that offers a responsive design, enhancing efficiency for restaurant owners and staff." />
      <meta property="og:image" content="/icon-512.png" />
      <link rel="icon" type="image/png" href="/icon-192.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
      <!-- Web fonts load without blocking: the app starts on system fonts and swaps when they arrive. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Outfit:wght@300;400;500;600;700;800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Noto+Sans+Kannada:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
      <script>
        (function () {
          // Dark is the default; light only when the user picked it (matches ThemeProvider).
          var t = null;
          try { t = localStorage.getItem('cafyz_theme_mode'); } catch (e) {}
          var dark = t !== 'light';
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          try { document.documentElement.dataset.palette = localStorage.getItem('cafyz_theme_palette') || 'violet'; } catch (e) {}
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#070511' : '#f4f2fb');
        })();
      </script>
      <style>
        html, body {
          height: 100%;
          margin: 0;
          background: var(--cafyz-app-bg, #070511);
        }
        #root {
          height: 100%;
          min-height: 100%;
          min-height: 100dvh;
          background: var(--cafyz-app-bg, #070511);
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
