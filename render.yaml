services:
  - type: web
    name: cafyz-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_URL
        sync: false          # paste from backend/.env in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false          # paste from backend/.env in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates a secure random value automatically
      - key: ALLOWED_ORIGIN
        value: https://cafyz.ametronyx.com
      - key: APP_URL
        value: https://cafyz.ametronyx.com
      # Stops the free instance sleeping (see backend/src/services/keepAwake.ts).
      # BUDGET: a Render account gets 750 free instance hours a calendar month,
      # shared across every free service, and a month is ~730 hours. One service
      # awake around the clock eats nearly all of it, and running out suspends
      # EVERY free service in the account until the 1st. With cafyz-api, the
      # Coorg API and credi8-backend all on free, pick a window instead:
      # 3 services x 8 h/day x 30 days = 720 h, which fits. Leave KEEP_AWAKE
      # unset to keep the old behaviour.
      - key: KEEP_AWAKE
        sync: false        # set to "true" in the dashboard when you want it
      - key: KEEP_AWAKE_WINDOW
        sync: false        # e.g. "3-10" = 03:00-10:59 UTC, eight hours a day
      # Set in Render dashboard (see backend/.env.example):
      # RESEND_API_KEY, CLOUDINARY_*, FOUNDER_EMAIL, FOUNDER_PASSWORD, FIREBASE_SERVER_KEY
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET (payments)
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_ID_ANDROID, GOOGLE_CLIENT_ID_IOS (Google sign-in)
      # ONLINE_PAYMENTS_ENABLED=true — only after Razorpay KYC + LIVE keys are set.
      # Until then purchases email the founder; no client rebuild needed to flip.

  # Optional: host web-v2 on Render (canonical web deploy is Vercel).
  - type: web
    name: cafyz-web
    runtime: node
    rootDir: web-v2
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
