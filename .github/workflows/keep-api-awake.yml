# Render's free instance sleeps after 15 minutes without traffic, and the first
# request then takes ~50 s to wake it. Ping the health check so App Review and
# users never land on a cold API.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://cafyz.onrender.com/health
